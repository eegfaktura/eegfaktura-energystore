# Voll-Pipeline (Build + Push + dispatch-deploy) fuer eegfaktura-energystore.
# Pusht ins Development-Tier ghcr.io/vfeeg-development/eegfaktura-energystore
# gemaess ADR-0005 (Two-Tier-Image-Registry) im Platform-Repo.
#
# Build-Flow:
#   1. Checkout
#   2. Go-Setup + protoc-Codegen (scripts/dev/generate.sh), Tests mit -race,
#      Coverage-Untergrenzen, gofmt/vet (M0 des Testumgebungs-Plans)
#   3. docker/login-action mit VFEEG_DEV_PUSH_PAT (Cross-Org-Push)
#   4. docker/build-push-action -> ghcr.io/vfeeg-development/eegfaktura-energystore
#   5. Build-Provenance-Attestation
#   6. repository_dispatch deploy-energystore an Platform-Repo
#
# Vorbedingungen:
#   - VFEEG_DEV_PUSH_PAT-Secret im Repo (Classic PAT, write:packages auf
#     vfeeg-development, 90-Tage-Expiry)
#   - PLATFORM_DEPLOY_PAT-Secret (fuer dispatch-Trigger)
#   - K8s-Manifest k8s/50-energystore.yaml im Platform-Repo zeigt auf
#     ghcr.io/vfeeg-development/eegfaktura-energystore:latest
#   - deploy-on-dispatch.yml im Platform-Repo akzeptiert `deploy-energystore`

name: Docker Image CI

on:
  push:
    branches:
      - master
      - main
      - 'preview/**'
      - 'env/**'
    tags:
      - v*
  pull_request:
    branches:
      - master
      - main

env:
  REGISTRY: "ghcr.io"
  # Image landet im Development-Tier (vfeeg-development), nicht im Release-Tier
  # (eegfaktura). Siehe ADR-0005 im Platform-Repo. Repo-Name bleibt dynamisch,
  # damit das Template ohne Aenderung in andere Source-Repos uebernehmbar ist.
  IMAGE_NAME: vfeeg-development/${{ github.event.repository.name }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go (for protoc plugins)
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install protoc + Go gRPC plugins (pinned, scripts/dev/generate.sh)
        run: |
          set -eu
          # Versions as in scripts/dev/generate.sh (known-errors #1, #10; open-points ES-2, ES-3).
          curl -sSfL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          mkdir -p "$HOME/.local/opt/protoc" && unzip -q /tmp/protoc.zip -d "$HOME/.local/opt/protoc"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/opt/protoc/bin" >> "$GITHUB_PATH"

      - name: Generated code is up to date
        run: |
          bash scripts/dev/generate.sh
          git diff --exit-code protoc/

      # Tests gate the image (M0): a red test, a race, a format or vet finding outside the
      # recorded ones (#11, #47) or a package below its coverage floor stops the job before
      # anything is built or pushed. The root package (three func main) is left out, #1.
      - name: Format and vet
        run: bash scripts/dev/static-check.sh

      - name: Go tests (race detector, coverage)
        env:
          TZ: UTC   # the tests fix Europe/Vienna themselves (TestMain); UTC proves it
        run: bash scripts/dev/test.sh

      - name: Coverage floors
        run: |
          bash scripts/dev/coverage-check.sh cover.out
          go tool cover -html=cover.out -o coverage.html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            cover.out
            coverage.html
          if-no-files-found: ignore

      - name: govulncheck (reporting only)
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck $(bash scripts/dev/packages.sh)

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title="eegfaktura-energystore"
            org.opencontainers.image.description="EEG Faktura energy store - holds the energy data of renewable communities (Go)"
            org.opencontainers.image.source=${{ github.event.repository.html_url || '' }}
            org.opencontainers.image.url=${{ github.event.repository.html_url || '' }}
            org.opencontainers.image.version=${{ github.sha || '' }}
            org.opencontainers.image.revision=${{ github.sha || '' }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || '' }}
            org.opencontainers.image.authors="eegfaktura@vfeeg.org"
            org.opencontainers.image.vendor="Verein zur Förderung von Erneuerbaren Energiegemeinschaften"
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id || '' }}
            org.opencontainers.image.ref.name=${{ github.ref || '' }}
            org.opencontainers.image.ref.sha=${{ github.sha || '' }}
            org.opencontainers.image.repository=${{ github.repository || '' }}

      - name: Login to Container Registry
        # Push cross-org nach vfeeg-development/* — GITHUB_TOKEN reicht dafuer
        # nicht (scope ist auf den source-repo beschraenkt). Nutzen den Classic-PAT
        # VFEEG_DEV_PUSH_PAT (write:packages auf vfeeg-development, 90-Tage-Expiry).
        # GHCR validiert via Token, nicht via username — github.actor bleibt.
        # Pull-Requests duerfen nicht pushen, daher Login-Step nur bei push-event.
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.VFEEG_DEV_PUSH_PAT }}

      - name: Build (PR) / Build and push (push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags || 'latest' }}
          labels: ${{ steps.meta.outputs.labels || '' }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Generate artifact attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Triggert das Platform-Repo, damit es den Cluster aktualisiert.
  # Laeuft nur bei push to default-branch (main/master), nicht bei PRs oder Tags.
  # Vorbedingung: PLATFORM_DEPLOY_PAT-Secret im Repo gesetzt (Fine-grained PAT
  # 'eegfaktura-platform-dispatch' mit Repository-Dispatch-Write auf
  # vfeeg-development/eegfaktura-platform).
  dispatch-deploy:
    needs: build-and-push-image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy in platform repo
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_DEPLOY_PAT }}
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "event_type": "deploy-energystore",
            "client_payload": {
              "image_tag": "latest",
              "source_sha": "${GITHUB_SHA}",
              "source_repo": "${GITHUB_REPOSITORY}",
              "source_ref": "${GITHUB_REF}"
            }
          }
          EOF
          )
          echo "$PAYLOAD" | gh api repos/vfeeg-development/eegfaktura-platform/dispatches --input -
          echo "Dispatched deploy-energystore for sha=${GITHUB_SHA:0:8}"

  # Preview-Deploy (ADR-0007): Push auf preview/** -> pinned Deploy des sha-Builds
  # in die Dev-Zone, ohne main/Release anzufassen. Nur auf preview/**-Branches.
  dispatch-preview-deploy:
    needs: build-and-push-image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/preview/')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pinned preview deploy in platform repo
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_DEPLOY_PAT }}
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "event_type": "deploy-energystore",
            "client_payload": {
              "mode": "pinned",
              "image_tag": "sha-${GITHUB_SHA:0:7}",
              "source_sha": "${GITHUB_SHA}",
              "source_repo": "${GITHUB_REPOSITORY}",
              "source_ref": "${GITHUB_REF}"
            }
          }
          EOF
          )
          echo "$PAYLOAD" | gh api repos/vfeeg-development/eegfaktura-platform/dispatches --input -
          echo "Dispatched pinned preview deploy-energystore for sha-${GITHUB_SHA:0:7}"

  # Feature-Env-Deploy (ADR-0008): Push auf env/<name> -> pinned Deploy des sha-Builds
  # in den Namespace env-<name>. Die Env muss bereits provisioniert sein
  # (overlays/env/<name> im platform-Repo); dieser Job deployt nur hinein.
  dispatch-env-deploy:
    needs: build-and-push-image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/env/')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pinned env deploy in platform repo
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_DEPLOY_PAT }}
        run: |
          set -eu
          ENV_NAME="${GITHUB_REF#refs/heads/env/}"
          case "$ENV_NAME" in
            *[!a-z0-9-]*|-*|*-|"") echo "Ungueltiger Env-Name aus '$GITHUB_REF' — erlaubt: a-z, 0-9, '-'" >&2; exit 1 ;;
          esac
          PAYLOAD=$(cat <<EOF
          {
            "event_type": "deploy-energystore",
            "client_payload": {
              "mode": "pinned",
              "env": "${ENV_NAME}",
              "image_tag": "sha-${GITHUB_SHA:0:7}",
              "source_sha": "${GITHUB_SHA}",
              "source_repo": "${GITHUB_REPOSITORY}",
              "source_ref": "${GITHUB_REF}"
            }
          }
          EOF
          )
          echo "$PAYLOAD" | gh api repos/vfeeg-development/eegfaktura-platform/dispatches --input -
          echo "Dispatched pinned env deploy-energystore for sha-${GITHUB_SHA:0:7} -> env-${ENV_NAME}"
