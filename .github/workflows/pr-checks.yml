# Tests on every pull request: the unit tests (every tested package, quick: no race detector, no
# coverage) and the full suite (scripts/dev: gofmt/vet with the recorded findings, the race
# detector, coverage floors). The root package (three func main) is left out, known-errors #1.
# The protobuf stubs are committed; docker-image.yml checks that they match the .proto files.
# Versions fixed, each release older than 7 days (checked 2026-10-09): Go 1.25.14 (2026-08-19).
# Actions pinned by commit SHA.

name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.14'
  TZ: UTC  # the tests fix Europe/Vienna themselves (TestMain); UTC proves it

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Unit tests
        run: |
          mapfile -t pkgs < <(bash scripts/dev/packages.sh)
          go test -count=1 -timeout 300s "${pkgs[@]}"

  full:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Format and vet
        run: bash scripts/dev/static-check.sh

      - name: Tests (race detector, coverage)
        run: bash scripts/dev/test.sh

      - name: Coverage floors
        run: bash scripts/dev/coverage-check.sh cover.out
