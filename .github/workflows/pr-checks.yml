# Tests on every pull request: the unit tests (every tested package, quick: no race detector, no
# coverage) and the full suite (scripts/dev: gofmt/vet with the recorded findings, the race
# detector, coverage floors). The root package (three func main) is left out, known-errors #1.
# The protobuf stubs are committed; docker-image.yml checks that they match the .proto files.
# Versions fixed, each release older than 7 days (checked 2026-10-09, Go 2026-10-21): Go 1.26.9 (2026-10-08;
# 1.26.10 of 2026-10-19 was too new).
# Actions pinned by commit SHA.
# Every job keeps its output as an artifact for 30 days (test-results-<job>), for the CI report
# collector (vfeeg-development/eegfaktura-dev).

name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.9'
  TZ: UTC  # the tests fix Europe/Vienna themselves (TestMain); UTC proves it
  # go test -json is kept as the result file; the console shows the test output read back from it
  # (as with go test -v). Exit codes are go test's (pipefail).
  GO_TEST_OUTPUT: '(fromjson? // {Action: "output", Output: (. + "\n")}) | select(.Action == "output" or .Action == "build-output") | .Output'

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Unit tests
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(bash scripts/dev/packages.sh)
          [ "${#pkgs[@]}" -gt 0 ]
          mkdir -p "$RUNNER_TEMP/results"
          go test -json -count=1 -timeout 400s "${pkgs[@]}" \
            | tee "$RUNNER_TEMP/results/unit.json" | jq -Rrj --unbuffered "$GO_TEST_OUTPUT"

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-unit
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          retention-days: 30

  full:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Format and vet
        run: bash scripts/dev/static-check.sh

      - name: Tests (race detector, coverage)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/results"
          bash scripts/dev/test.sh 2>&1 | tee "$RUNNER_TEMP/results/full.log"

      - name: Coverage floors
        run: bash scripts/dev/coverage-check.sh cover.out

      - name: Keep the test results
        if: always()
        run: cp cover.out "$RUNNER_TEMP/results/" 2>/dev/null || true

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-full
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          retention-days: 30
